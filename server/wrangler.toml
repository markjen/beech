# One Worker serves both the built web app (../dist) and the account API
# under /api/*, so the website and its API share an origin (no CORS, no
# third-party cookies). The native apps call the same /api with a bearer token.
name = "beech"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "beech"
# Replace with the id printed by `npx wrangler d1 create beech` (see docs/BACKEND.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Production custom domain (needs the domain's DNS on Cloudflare). Uncomment and set:
# routes = [{ pattern = "beech.example.com", custom_domain = true }]

[vars]
# Comma-separated OAuth client IDs whose Google ID tokens are accepted
# (web client, plus the iOS/Android client IDs once the apps sign in natively).
GOOGLE_CLIENT_IDS = ""
# Sign in with Apple: the app's bundle id (app.beech.beach) and, for the web, the Services ID.
APPLE_CLIENT_IDS = ""
# Extra origins allowed to call the API cross-origin (the native app shells).
ALLOWED_ORIGINS = "capacitor://localhost,https://localhost"
# "1" enables POST /api/auth/dev (local development and tests only). Never in production.
DEV_AUTH = "0"
