\* A trade-in checks, then takes and credits in another statement. Expected to
\* break NoPhantomUnits (two trade-ins of the last unit) and NeverTradePlaced
\* (a save places it between the check and the take).
CONSTANTS
    Requests = {r1, r2}
    Values = {1, 2}
    Pack = 2
    MaxPacks = 2
    MaxUnits = 2
    Fixed = FALSE
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANTS TypeOK NoPhantomUnits NeverTradePlaced
