\* The obvious build: the free go is "is it free?" then the write, without
\* re-checking the go count the starter was drawn for; the paid try reads
\* the balance, then debits. Expected to break OneGoPerRest (two devices
\* both see "free"), StarterOnce (both draw the first gift) and PaidInFull
\* (both see enough bucks).
CONSTANTS
    Me = a
    Other = b
    Devices = {1, 2}
    Starters = 1
    MaxGoes = 2
    Price = 1
    StartBucks = 1
    Fixed = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK OneGoPerRest StarterOnce PaidInFull
