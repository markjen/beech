\* Copy read, checked and written in three statements. Expected to break
\* WithinBag (a save between the check and the write), WithinAllowance (two
\* copies to new beaches both pass) and NoCopyOffShore (the owner hides the
\* beach between the read and the write).
CONSTANTS
    Requests = {r1, r2}
    Slots = {b1, b2, b3}
    Home = b1
    Allowance = 2
    MaxOwned = 2
    MaxN = 1
    MaxVer = 1
    Fixed = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK WithinBag WithinAllowance NoCopyOffShore
