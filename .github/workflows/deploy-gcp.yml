name: Deploy production (Google Cloud Run)

# Builds the production containers and deploys them to Cloud Run, both
# connected to the same Cloud SQL for PostgreSQL database:
#   beech        the game: web app with accounts + API server
#   beech-admin  the admin console (gift cards, promo codes, beaches). Its own
#                service; nothing loads there without a Google sign-in by an
#                ADMIN_EMAILS account (docs/GIFT_CARDS_PROMOS.md).
# GitHub Pages keeps serving the public sandbox build (no sign-in).
#
# TRIGGER BRANCH — main is the build source:
# The session branch `ccr-85f84f81-0scrin` was merged into `main` on
# Nov 22, 2026, and development now lands on `main`. Trigger on `main`.
# (The github-pages sandbox in deploy.yml still builds from the default
# branch; that is a separate, sandbox-only workflow.)
#
# One-time setup and the variables below: docs/GCP.md (or infra/README.md)
#   vars.GCP_ENABLED = 1            turns this workflow on
#   vars.GCP_PROJECT_ID, vars.GCP_REGION
#   vars.GCP_WIF_PROVIDER           projects/<num>/locations/global/workloadIdentityPools/github/providers/github
#   vars.GCP_DEPLOY_SA              deployer service account email
#   vars.GCP_RUNTIME_SA             service account the service runs as
#   vars.GCP_SQL_INSTANCE           <project>:<region>:beech-db
#   vars.GOOGLE_CLIENT_ID           OAuth web client ID (public)
#   vars.GOOGLE_CLIENT_IDS          accepted client IDs, comma-separated (web, iOS, Android)
#   vars.APPLE_CLIENT_IDS           optional
#   vars.ADMIN_EMAILS               Google accounts allowed into the admin console
# Push notifications (docs/INBOX_NOTIFICATIONS.md, "Turning on push"), each
# part added only once its variable is set, so a deploy never names a secret
# that doesn't exist yet:
#   vars.VAPID_PUBLIC_KEY, vars.VAPID_SUBJECT   web push (+ secret beech-vapid-private-key)
#   vars.APNS_KEY_ID, vars.APNS_TEAM_ID         iOS app push (+ secret beech-apns-key, the .p8)
#   vars.FCM_PROJECT_ID                         Android app push (the service's own identity sends)
#   vars.PUSH_TICK_SERVICE_ACCOUNT              Cloud Scheduler's account for POST /api/push/tick
#   vars.PUSH_TICK_AUDIENCE                     its OIDC audience (the tick URL)
# Secret Manager: beech-db-password, beech-admin-token (admin service only),
#   beech-gift-code-pepper (both: the game redeems, the admin service issues),
#   beech-xsolla-api-key and beech-xsolla-webhook-secret (game service only,
#   web checkout; XSOLLA_SANDBOX=1 until the live launch)
# No keys are stored in GitHub: authentication is Workload Identity Federation,
# and the database password lives in Secret Manager (beech-db-password).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.GCP_ENABLED == '1' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/beech/beech:${{ github.sha }}
      ADMIN_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/beech/beech-admin:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
      - name: Server tests
        working-directory: server
        run: npm ci && npm run typecheck && npm test
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the images
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" --build-arg "VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" .
          docker build --target admin -t "$ADMIN_IMAGE" .
          docker push "$IMAGE"
          docker push "$ADMIN_IMAGE"
      - name: Deploy to Cloud Run
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          PUSH_TICK_SERVICE_ACCOUNT: ${{ vars.PUSH_TICK_SERVICE_ACCOUNT }}
          PUSH_TICK_AUDIENCE: ${{ vars.PUSH_TICK_AUDIENCE }}
        run: |
          PUSH_ENV=""
          PUSH_SECRETS=""
          if [ -n "$VAPID_PUBLIC_KEY" ]; then
            PUSH_ENV="$PUSH_ENV;VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY;VAPID_SUBJECT=$VAPID_SUBJECT"
            PUSH_SECRETS="$PUSH_SECRETS,VAPID_PRIVATE_KEY=beech-vapid-private-key:latest"
          fi
          if [ -n "$APNS_KEY_ID" ]; then
            PUSH_ENV="$PUSH_ENV;APNS_KEY_ID=$APNS_KEY_ID;APNS_TEAM_ID=$APNS_TEAM_ID"
            PUSH_SECRETS="$PUSH_SECRETS,APNS_KEY=beech-apns-key:latest"
          fi
          if [ -n "$FCM_PROJECT_ID" ]; then PUSH_ENV="$PUSH_ENV;FCM_PROJECT_ID=$FCM_PROJECT_ID"; fi
          if [ -n "$PUSH_TICK_SERVICE_ACCOUNT" ]; then
            PUSH_ENV="$PUSH_ENV;PUSH_TICK_SERVICE_ACCOUNT=$PUSH_TICK_SERVICE_ACCOUNT;PUSH_TICK_AUDIENCE=$PUSH_TICK_AUDIENCE"
          fi
          gcloud run deploy beech \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --add-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --set-env-vars "^;^DB_SOCKET=/cloudsql/${{ vars.GCP_SQL_INSTANCE }};DB_NAME=beech;DB_USER=beech;GOOGLE_CLIENT_IDS=${{ vars.GOOGLE_CLIENT_IDS }};APPLE_CLIENT_IDS=${{ vars.APPLE_CLIENT_IDS }};ALLOWED_ORIGINS=https://play.beech.games,capacitor://localhost,https://localhost,app://beech;XSOLLA_PROJECT_ID=324072;XSOLLA_SANDBOX=1$PUSH_ENV" \
            --set-secrets "DB_PASSWORD=beech-db-password:latest,GIFT_CODE_PEPPER=beech-gift-code-pepper:latest,XSOLLA_API_KEY=beech-xsolla-api-key:latest,XSOLLA_WEBHOOK_SECRET=beech-xsolla-webhook-secret:latest$PUSH_SECRETS" \
            --cpu 1 --memory 512Mi --concurrency 80 \
            --min-instances 0 --max-instances 10
      - name: Deploy the admin console to Cloud Run
        run: |
          APP_URL=$(gcloud run services describe beech --region "$REGION" --format 'value(status.url)')
          gcloud run deploy beech-admin \
            --image "$ADMIN_IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --add-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --set-env-vars "^;^DB_SOCKET=/cloudsql/${{ vars.GCP_SQL_INSTANCE }};DB_NAME=beech;DB_USER=beech;GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }};ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }};BEECH_APP_URL=$APP_URL" \
            --set-secrets "DB_PASSWORD=beech-db-password:latest,ADMIN_API_TOKEN=beech-admin-token:latest,GIFT_CODE_PEPPER=beech-gift-code-pepper:latest" \
            --cpu 1 --memory 256Mi --concurrency 20 \
            --min-instances 0 --max-instances 1
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe beech --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/api/health"
          curl -fsS -o /dev/null "$URL/"
          # the landing page, previewable under /landing on any host
          curl -fsS "$URL/landing" | grep -q 'a quiet place by the sea'
          # the game no longer has an admin API
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/admin/me")" = 404
          # the public shore site, served under /shore on the game's host
          # (its own hosts, beechshore.com, answer the same pages at /)
          curl -fsS "$URL/shore" | grep -q 'Every beach on the shore'
          ADMIN_URL=$(gcloud run services describe beech-admin --region "$REGION" --format 'value(status.url)')
          curl -fsS "$ADMIN_URL/health"
          # signed out: the sign-in page only, and the API refuses
          curl -fsS "$ADMIN_URL/" | grep -q 'beech admin sign-in'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$ADMIN_URL/api/me")" = 401
          echo "admin console: $ADMIN_URL"
