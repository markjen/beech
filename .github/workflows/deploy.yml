name: Deploy web build to GitHub Pages

# Publishes dist/ to GitHub Pages on every push to main (and the agent
# development branch, so work can be played before it is merged).
# configure-pages tries to switch Pages on; if the token isn't allowed to, a
# repo admin sets Settings -> Pages -> Source: "GitHub Actions" once.
on:
  push:
    branches: [main, ccr-85f84f81-0scrin]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # the github-pages environment only accepts the repo's default branch
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
