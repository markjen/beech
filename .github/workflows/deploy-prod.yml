name: Deploy production (Cloudflare)

# The production app: web build WITH accounts, served by the Worker in
# server/ together with the /api it talks to (same origin), backed by D1.
# GitHub Pages keeps the public sandbox build (no sign-in).
#
# Needs (Settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" + D1 edit
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable D1_DATABASE_ID         from `npx wrangler d1 create beech`
#   variable GOOGLE_CLIENT_ID       OAuth *web* client ID (public)
#   variable GOOGLE_CLIENT_IDS      all accepted client IDs, comma-separated (web, iOS, Android)
#   variable APPLE_CLIENT_IDS       optional: bundle id / Services ID for Sign in with Apple
#   variable PROD_ENABLED = 1       turns this workflow on
# See docs/BACKEND.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PROD_ENABLED == '1' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the web app with accounts on
        run: npm run build
        env:
          VITE_ACCOUNTS: '1'
          VITE_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Install server
        working-directory: server
        run: npm ci && npm test
      - name: Point wrangler at the production database
        working-directory: server
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - name: Migrate D1
        working-directory: server
        run: npx wrangler d1 migrations apply beech --remote
      - name: Deploy Worker + static app
        working-directory: server
        run: >
          npx wrangler deploy
          --var "GOOGLE_CLIENT_IDS:${{ vars.GOOGLE_CLIENT_IDS }}"
          --var "APPLE_CLIENT_IDS:${{ vars.APPLE_CLIENT_IDS }}"
          --var "DEV_AUTH:0"
