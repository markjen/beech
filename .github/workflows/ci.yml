name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app with accounts + dev sign-in (for the local Worker)
        run: npm run build
        env:
          VITE_ACCOUNTS: '1'
          VITE_DEV_AUTH: '1'
      - name: Server unit tests + typecheck
        working-directory: server
        run: npm ci && npm run typecheck && npm test
      - name: API end-to-end against wrangler dev (local D1)
        working-directory: server
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          cp .dev.vars.example .dev.vars
          npm run migrate:local
          (npx wrangler dev --local --persist-to .wrangler/state --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          BEECH_API=http://127.0.0.1:8787 npm run test:e2e || (cat wrangler.log; exit 1)
