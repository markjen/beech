name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Desktop (Steam) typecheck
        working-directory: desktop
        run: npm ci && npm run typecheck

  # Formal proofs of the files in LemmaScript-files.txt (docs/VERIFICATION.md).
  # Versions and checksum match .claude/hooks/session-start.sh.
  verify:
    runs-on: ubuntu-latest
    env:
      DAFNY_VERSION: 4.11.0
      DAFNY_SHA256: a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179
      LSC_VERSION: 0.6.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dafny and lsc
        run: |
          curl -fsSL -o dafny.zip "https://github.com/dafny-lang/dafny/releases/download/v$DAFNY_VERSION/dafny-$DAFNY_VERSION-x64-ubuntu-22.04.zip"
          echo "$DAFNY_SHA256  dafny.zip" | sha256sum --check
          unzip -q dafny.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"
          npm install -g "lemmascript@$LSC_VERSION"
      - name: Verify (lsc check, every listed file)
        run: lsc check --backend=dafny

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beech
          POSTGRES_PASSWORD: beech
          POSTGRES_DB: beech_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beech" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Server typecheck + tests on PGlite
        working-directory: server
        run: npm ci && npm run typecheck && npm test
      - name: Same DB tests on real Postgres 16
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://beech:beech@localhost:5432/beech_test
        # Each Vitest worker uses its own Postgres schema (server/test/testDb.ts),
        # so DB test files run safely in parallel. Pure non-DB unit test files
        # already ran in the step above and are skipped here.
        run: >-
          npm test --
          --exclude test/auth.test.ts
          --exclude test/beachImage.test.ts
          --exclude test/giftCards.test.ts
          --exclude test/guide.test.ts
          --exclude test/store.test.ts
          --exclude test/vending.test.ts

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beech
          POSTGRES_PASSWORD: beech
          POSTGRES_DB: beech_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beech" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: beech:ci
          build-args: VITE_GOOGLE_CLIENT_ID=ci-client
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production image boots and serves health + SPA + auth gate
        run: |
          docker run -d --name beech --network host -e PORT=8080 \
            -e DATABASE_URL=postgres://beech:beech@localhost:5432/beech_test beech:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs -o /dev/null http://localhost:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = 401
          docker logs beech
