name: Mobile builds

# Builds the native shells so breakage is caught early.
#  - android: debug APK always; a signed release AAB when the signing secrets exist
#  - ios: simulator build without signing (proves the Xcode project compiles)
# Store uploads are a separate, manual workflow (release-mobile.yml).
on:
  push:
    branches: [main, ccr-85f84f81-0scrin]
    paths: ['src/**', 'android/**', 'ios/**', 'capacitor.config.ts', 'package*.json', 'scripts/sync-android.mjs', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run cap:sync:android
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Release AAB (signed if secrets are configured)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BEECH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BEECH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BEECH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export BEECH_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ACCOUNTS: '1'
          VITE_API_URL: https://beech.markjen.com
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - run: npx cap sync ios
      - name: Simulator build (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
