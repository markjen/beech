name: Release to stores

# Manual: Actions -> "Release to stores" -> Run workflow.
# Needs the secrets listed in docs/MOBILE.md. Bump the version first with
#   node scripts/set-version.mjs <version> <build>
# iOS also builds automatically after every successful production deploy
# (docs/MOBILE.md, "iOS auto-build"): the build number is this workflow's
# run number, so it always goes up and is never committed back to main.
# Android stays manual: it is a hosted shell, so web deploys reach it
# without a rebuild.
on:
  workflow_dispatch:
    inputs:
      android:
        description: Upload Android AAB to Google Play (internal track)
        type: boolean
        default: true
      ios:
        description: Upload iOS build to App Store Connect (TestFlight)
        type: boolean
        default: true
  workflow_run:
    workflows: ["Deploy production (Google Cloud Run)"]
    types: [completed]
    branches: [main]

jobs:
  android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # native push (docs/INBOX_NOTIFICATIONS.md): set the NATIVE_PUSH variable
      # to 1 once the Firebase app and the GOOGLE_SERVICES_JSON secret exist
      - name: Firebase config for push
        if: ${{ vars.NATIVE_PUSH == '1' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
      - run: npm ci && npm test && npm run cap:sync:android
        env:
          BEECH_NATIVE_PUSH: ${{ vars.NATIVE_PUSH }}
      - name: Signed release bundle
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BEECH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BEECH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BEECH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export BEECH_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.beech.beach
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    # Manual dispatch, or an auto-build after a successful production
    # deploy. On workflow_run the inputs are empty, so the gate has to
    # name the event; a plain `inputs.ios` would silently skip the job.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.ios) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch, not the deployed
          # commit; build exactly what deployed, not whatever main has
          # since (a later, undeployed commit must wait for its own deploy).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Auto-build (docs/MOBILE.md, "iOS auto-build"): the build number is
      # this workflow's run number — monotonic across manual and auto runs,
      # so Apple never sees a duplicate, and nothing is committed back to
      # main (no push-loop risk). The checked-in CURRENT_PROJECT_VERSION
      # lags what is in TestFlight; see the manual guard below.
      - name: Auto build number
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          node scripts/set-version.mjs "$(node -p "require('./package.json').version")" "${{ github.run_number }}"
          echo "iOS build number is ${{ github.run_number }} (this workflow's run number)"
      # Manual releases must bump first when the checked-in marketing
      # version is the one auto-builds have been uploading: the build
      # number has to be ahead of every auto-build number already
      # uploaded for that version, or Apple rejects the upload as a
      # duplicate. Build numbers restart per marketing version, so a
      # manual release that bumps the marketing version skips the check.
      # Fails fast here instead of five minutes into the archive.
      - name: Manual build number must be ahead of auto builds
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checked_in_build=$(grep -m1 'CURRENT_PROJECT_VERSION =' ios/App/App.xcodeproj/project.pbxproj | grep -Eo '[0-9]+')
          checked_in_version=$(grep -m1 'MARKETING_VERSION =' ios/App/App.xcodeproj/project.pbxproj | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          # The marketing version auto-builds have been uploading: the
          # package.json version at the head of the last successful
          # auto-build run. No successful auto-build yet means nothing
          # can collide, so the check is skipped.
          last_auto_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/release-mobile.yml/runs?event=workflow_run&per_page=5" --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | .head_sha // empty')
          if [ -z "$last_auto_sha" ]; then
            echo "No successful auto-build yet; the run-number check does not apply."
            exit 0
          fi
          auto_version=$(gh api "repos/${{ github.repository }}/contents/package.json?ref=${last_auto_sha}" -H "Accept: application/vnd.github.raw" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$checked_in_version" != "$auto_version" ]; then
            echo "Checked-in marketing version $checked_in_version differs from the version auto-builds have been uploading ($auto_version); build numbers restart per version, so no collision check applies."
            exit 0
          fi
          if [ "$checked_in_build" -le $(( ${{ github.run_number }} - 1 )) ]; then
            echo "::error::CURRENT_PROJECT_VERSION is $checked_in_build for $checked_in_version, but run numbers up to $(( ${{ github.run_number }} - 1 )) are already spoken for by earlier release-mobile runs (auto-builds upload the run number as the build number). Bump it first: node scripts/set-version.mjs <version> <build> with a build number above $(( ${{ github.run_number }} - 1 )), or bump the marketing version (e.g. 1.0.0 -> 1.0.1) to restart build numbers. See docs/MOBILE.md, 'iOS auto-build'."
            exit 1
          fi
      - run: npm ci && npm test && npm run build && npx cap sync ios
        env:
          BEECH_NATIVE_PUSH: ${{ vars.NATIVE_PUSH }}
          VITE_ACCOUNTS: '1'
          VITE_API_URL: https://beech.markjen.com
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      # the push entitlement, once Push Notifications is on for the App ID
      - name: Push entitlement
        if: ${{ vars.NATIVE_PUSH == '1' }}
        run: /usr/libexec/PlistBuddy -c "Add :aps-environment string production" ios/App/App/App.entitlements
      # Stored signing identity (docs/MOBILE.md, "Stored iOS signing
      # identity"): automatic signing mints a new certificate on every
      # ephemeral runner, and the team hit Apple's cap (2 dev / 3
      # distribution) on 2026-11-28, so every auto-build failed at
      # archive. The .p12 and provisioning profile below are stored as
      # repo secrets and reused every run, so CI never creates a
      # certificate. No -allowProvisioningUpdates: that flag only
      # applies to automatic signing.
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          # the action needs a keychain password; reuse the .p12 one so
          # there is one fewer secret to rotate
          keychain-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/Beech.mobileprovision"
          echo "$PROFILE_B64" | base64 -d > "$PROFILE_PATH"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_P8_B64" | base64 -d > ~/private_keys/AuthKey_$API_KEY_ID.p8
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.beech.beach</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          # the API-key flags stay: with manual signing they no longer
          # manage signing assets, but the upload still authenticates
          # to App Store Connect through them
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_$API_KEY_ID.p8 \
            -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"
